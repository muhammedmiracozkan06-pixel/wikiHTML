      <h3>Apple(Şirket)</h3>
      <p>Apple Inc. ya da eski adıyla Apple Computer Inc., merkezi Cupertino'da[3] bulunan; tüketici elektroniği, bilgisayar yazılımı ve kişisel bilgisayar tasarlayan, geliştiren ve satan Amerikan çok uluslu şirket. Şirket 1 Nisan 1976 tarihinde kurulmuş ve 3 Ocak 1977'de Apple Computer, Inc. adıyla anonim şirket haline gelmiştir.[4] İsminde yer alan "Computer" (Bilgisayar) kelimesi 9 Ocak 2007'de iPhone tanıtımıyla birlikte tüketici elektroniğine yönelimlerini yansıtması amacıyla kaldırılmıştır.[5][6][7] En bilinen donanım ürünleri Mac serisi bilgisayarlar, iPod müzik çalar, iPhone akıllı telefon, iPad tablet bilgisayar ve Apple Watch adlı akıllı saattir. Yazılımları arasında ise macOS ve iOS işletim sistemleri, iTunes medya tarayıcısı, Safari internet tarayıcısı ile iLife ve iWork paketleri yer almaktadır.

Apple, 2024 itibarıyla 391,04 milyar dolar cirosuyla dünyanın en büyük bilgi teknolojileri şirketi, dünyanın en büyük akıllı telefon üreticisidir.[8] Fortune dergisi Apple'ı, 2008 yılında Amerika Birleşik Devletleri'nde ve 2008 yılından 2012 yılına kadar dünya çapında en çok rağbet gören şirket olarak nitelendirmiştir.[9][10][11][12][13][14]

Kasım 2012 itibarıyla Apple'ın App Store ve iTunes Store online mağazalarına ek olarak 14 farklı ülkede 394 perakende satış mağazası[15][16] bulunmaktadır.[17] Borsa değeri açısından Apple 2012'nin Eylül ayından itibaren Dünyanın en değerli şirketi olmuştur.[18] 29 Eylül 2012 tarihi itibarıyla şirkette dünya çapında 72.800 devamlı tam zamanlı çalışan işçi ile 3,300 geçici tam zamanlı işçi çalışmaktadır. 2015'in Nisan ayından itibaren dünya çapındaki yıllık geliri toplamda 130,28 milyar dolardır. 2013 yılının Mayıs ayında Apple geçen yıla göre 11 numara yükselerek Fortune 500 listesinde 6. sırayla ilk kez ilk onda yer almıştır.[19]

Ancak 2025 verilerine göre Apple, 3 trilyon doların (3.000.000.000.000$) biraz üstü bir değerle, dünyanın en pahalı şirketi konumunda bulunur.

Tarihçe
Ana madde: Apple'ın tarihi
1976–80: Kuruluş ve şirketleşme

Apple'ın birleştirilmiş devre kartı olarak satılan, klavye, monitör ve kasası bulunmayan ilk ürünü, Apple I. Cihazın sahibi klavye ve tahta kasayı kendisi eklemiştir.
Apple, 1 Nisan 1976 yılında Steve Jobs, Steve Wozniak ve Ronald Wayne[20] tarafından Apple I kişisel bilgisayar kitini satmak amacıyla kuruldu. Wozniak kitleri kendisi üretti[21][22] ve Apple I ilk kez Homebrew Computer Club'da görücüye çıktı.[23] Apple I; günümüzde kişisel bilgisayar olarak kabul edilen cihazlardan daha basit şekilde anakart (CPU, RAM ve basit metin tabanlı ekran çipi ile birlikte) olarak satılmaktaydı.[24] 1976 yılının Temmuz ayında 666.66 dolar (2013 yılına göre 2,690 dolar) fiyat etiketiyle Apple I satışa sunuldu.[25][26][27][28][29]

Apple, 3 Ocak 1977'de Jobs ve Wozniak'a hisselerini 800 dolara sattığı için Wayne olmadan şirketleşti.[30] Şirketleşme sürecinde temel iş deneyimini ve 250.000 dolar ile sermayeyi Mike Markkula sağladı.[31][32]

Apple II, 16 Nisan 1977'de West Coast Computer Faire'de (West Coast Computer Faire) tanıtıldı. Karakter hücre tabanlı renkli grafikleri ve açık mimarisi ile rakipleri TRS-80 ve Commodore PET'den farklı özelliklere sahipti. İlk modellerde depolama birimi olarak kullanılan kaset bantlar 5 1/4 inch disket sürücüsü olan Disk II'nun tanıtımı ile birlikte kullanımdan kalktı.[33]

Apple II, VisiCalc hesap tablosu programı ile iş dünyasının ilk "killer app"'inin masaüstü platformu olmuştur.[34] VisiCalc, Apple II için bir iş pazarı yarattı ve ofise uyumlu olduğundan ev kullanıcılarına bilgisayar satın alma konusunda fazladan bir sebep verdi.[34] Apple, VisiCalc'dan önce Commodore ve Tandy'nin ardından üçüncü sırada yer almaktaydı.[35][36]

1970'li yılların sonlarına doğru Apple, bilgisayar tasarımı ve üretim hattı konularında elemana sahipti. 1980 yılının Mayıs ayında IBM ve Microsoft ile rekabet etmek amacıyla Apple III tanıtıldı.[37]

Jobs ve Jef Raskin'in de içinde bulunduğu bir grup Apple çalışanı 1979 yılının Aralık ayında Xerox Alto'yu görmek amacıyla Xerox PARC'ı ziyaret etti. Xerox, Apple mühendislerine halka arz öncesi 10 dolarlık fiyattan 100,000 hisse karşılığında üç gün boyunca tüm PARC tesislerine giriş izni verdi.[38] Jobs, gelecekteki bilgisayarların tümünde grafiksel kullanıcı arayüzü (GUI) kullanılacağının farkına vardı ve Apple Lisa için GUI geliştirilmeye başlandı.[39]

12 Aralık 1980'de Apple, 1956 yılında Ford Motor Company'nin halka arzından daha çok sermaye ve tarihteki diğer şirketlerden daha fazla milyoner (300'e yakın) yaratarak hisse başına 22 dolardan halka arz edildi.[40][41]

1981–85: Lisa ve Macintosh

Apple'ın Macintosh tanıtımı için hazırlanan ve distopik bir dünyada geçen, George Orwell’in Bin Dokuz Yüz Seksen Dört adlı romanından uyarlanan televizyon reklamı.
Steve Jobs, 1978 yılında Apple Lisa projesi üzerinde çalışmaya başladı fakat ekip ile arasındaki uyuşmazlıklar nedeniyle 1982'de Jef Raskin'in düşük bütçeli bilgisayar projesi olan Macintosh'ı üstlendi. Bunun üzerine Lisa ve Macintosh ekipleri arasında hangi ürünün daha önce piyasaya çıkacağına dair bir yarış başladı. Yarışı 1983 yılında Lisa ekibi kazandı ve halka satılan GUI'a sahip ilk bilgisayar Lisa oldu. Fakat yüksek fiyat etiketi ve az sayıdaki yazılımı nedeniyle başarılı olamadı.[42]


1984 yılında piyasaya sürülen ilk Macintosh.
1984 yılında Apple Macintosh'ı piyasaya sürdü ve 1.5 milyon dolar bütçeli ünlü "1984" televizyon reklamı ile tanıtımı yapıldı. Ridley Scott tarafından yönetilen reklam 22 Ocak 1984'te Super Bowl XVIII'ın üçüncü çeyreğinde yayımlandı.[43] Bu olay günümüzde Apple'ın başarısının kırılma noktası olarak değerlendirilmekte[44] ve ustalıkla yapılmış bir iş olduğu belirtilmektedir.[45][46]

Macintosh'ın satışları başlangıçta iyiydi fakat yüksek fiyatı ve az sayıdaki yazılımı nedeniyle sonraki satışlar daha iyi olmadı.[47] Ürünün kaderi makul bir fiyata satılan ilk PostScript lazer yazıcı olan LaserWriter'ın tanıtımı ve erken dönem masaüstü yayıncılık paketi PageMaker ile değişti. Bu üç ürünün birleşimi masaüstü yayıncılığı pazarının doğmasını sağladı.[48] Mac, kullandığı GUI için geliştirilen grafik kapasitesi sayesinde masaüstü yayıncılığı alanında oldukça güçlüydü.

1985 yılına gelindiğinde iki yıl önce göreve başlayan CEO John Sculley ile Jobs arasında bir iktidar mücadelesi başladı.[49] Apple yönetim kurulu Sculley'ye Jobs'ı frenlemesi ve test edilmemiş ürünlere pahalı yatırımlar yapabilme imkânını kısıtlaması yönünde talimat verdi. Jobs bu talimata uymak yerine Sculley'nin liderlik rolünü elinden almayı denedi fakat Sculley darbe girişiminin farkına vararak yönetim kurulunu toplantıya çağırdı. Toplantıda kurul Sculley'ye destek verdi ve Jobs'ın yönetim yetkileri elinden alındı.[47] Aynı yıl Jobs Apple'dan istifa ederek NeXT Inc.'i kurdu.[50]

1989–97: Düşüş
Ayrıca bakınız: Apple II serisi zaman çizelgesi ve Macintosh Modelleri Zaman Çizelgesi

1989 yılında piyasaya sürülen, Apple’ın ilk taşınabilir Macintosh bilgisayarı, Macintosh Portable.
1989 yılında tanıtılan Macintosh Portable, 7,5 kilogramlık ağırlığı ve 12 saatlik pil ömrü ile Macintosh'ın masaüstü versiyonu kadar güçlü olacak şekilde tasarlanmıştı. Macintosh Portable'dan sonra Apple 1991 yılında PowerBook'un tanıtımını yaptı. Aynı yıl, arayüze renk ekleyen ve yeni ağ becerilerine sahip olan System 7 yükseltmesi de tanıtıldı. Bu yükseltme 2001 yılına kadar Mac OS'in mimari yapısını oluşturdu.

Powerbook ve diğer ürünlerin başarısı cironun artışını da beraberinde getirdi.[49] Apple yeni ürünler tanıtarak ve karını yükselterek bir süre iyi işler yaptı. MacAddict dergisi 1989 ile 1991 yılları arasındaki bu dönemi Macintosh'ın "ilk altın çağı" olarak nitelendirmiştir.

Macintosh LC'nin başarısının ardından Apple, Centris, Quadra ve Performa serilerini piyasaya sürdü. Sears, Price Club ve Walmart gibi çeşitli tüketici pazarlarıyla rekabetten kaçınmak için çok sayıda şekil ve yazılım paketiyle piyasaya sürülen modeller tüketicilerin modeller arasındaki farklılıkları anlamasını zorlaştırdı ve kafa karışıklığı yarattı.[51]

Bu süreçte Apple, dijital kamera, taşınabilir CD çalar, hoparlör, oyun konsolu ve TV aksesuarı gibi tüketici odaklı ürünlerde başarısız denemeler yaptı.

Apple, alt uç Macintosh modellerinin satışlarını düşüren Apple II serisinin üretim için çok maliyetli olduğunu gördü.[52] 1990 yılında Apple II kullanıcılarını Macintosh platformuna çekmek amacıyla Apple IIe Card için tek genişletme yuvası bulunan Macintosh LC'yi tanıttı.[52] Apple, Apple IIe satışlarına 1993 yılında son verdi.

Apple, iyi mühendisliğe sahip fakat pahalı yazılımlar üretirken Microsoft, Windows ile düşük fiyatlı kişisel bilgisayarlara yönelik yazılımlar üretmeye odaklanarak pazar payını artırmaya devam etti.[53] Apple yüksek kar marjlarına güvenerek açık bir karşılık geliştirmedi. Bunun yerine Microsoft'a karşı Apple Lisa'da kullanılana benzer grafiksel kullanıcı arayüzü kullandıkları gerekçesiyle Apple Computer, Inc. v. Microsoft Corporation davasını açtı.[54] Dava reddedilinceye dek birkaç yıl devam etti. Aynı zamanda büyük ürün başarısızlıkları ile kaçırılan son teslim tarihleri Apple'ın itibarını sarstı ve CEO olan Sculley'nin yerine Michael Spindler getirildi.[55]


Endüstrinin ilklerin biri olan Newton, Apple’ın PDA marketine ilk giriş denemesiydi. Zamanla finansal bir başarısızlığa dönüşmüş olsa da gelecekte Palm Pilot ile Apple’ın kendi cihazları olan iPhone ve iPad’in yolunu açmıştır.
1990'lı yılların başında Apple, Macintosh için A/UX gibi alternatif platformlar geliştiriyordu. Ayrıca sadece Mac için America Online işbirliğiyle geliştirilen ve CompuServe gibi çevrimiçi servislerin Mac'e uyumlu alternatifi olması amacıyla tasarlanan eWorld adında çevrimiçi portal oluşturmaya çalışıyordu. Macintosh platformu çoklu göreve uygun olmaması ve bazı önemli yazılım yordamlarının doğrudan donanıma programlanması nedeniyle güncelliğini yitirmişti. Bununla birlikte Apple, Sun Microsystems gibi OS/2 ve UNIX sağlayıcılarıyla rekabet içerisindeydi. Macintosh'ın yeni bir platformla değiştirilmeye ya da daha güçlü donanım ile çalışacak şekilde yeniden biçimlendirilmeye ihtiyacı vardı.[56]

1994 yılında Apple, IBM ve Motorola ile AIM ittifakını oluşturdu. Amaçları Apple yazılımıyla bağlı, IBM ve Motorola donanımı kullanan yeni bir bilgisayar platformu (PowerPC Reference Platform) yaratmaktı. AIM ittifakı, PReP'in performansı ve Apple'ın yazılımının PC'yi geride bırakacağını ve böylece Microsoft'u yok edeceğini umuyordu. Aynı yıl Apple, Motorola'nın PowerPC işlemcisini kullanacak pek çok Apple bilgisayarından ilki olan Power Macintosh'ı tanıttı.[57]

1996 yılında CEO koltuğu Michael Spindler'dan Gil Amelio'ya geçti. Gil Amelio, geniş kapsamlı işten çıkarmalar dahil Apple'da pek çok değişiklik yaptı.[58] İlk olarak Taligent projesi, daha sonra Copland ve Gershwin ile Mac OS'i gelişme konusundaki sayısız başarısızlıktan sonra Amelio, NeXT ve onun NeXTSTEP işletim sistemini satın alıp Steve Jobs'ı danışman olarak Apple'a geri döndürmeye karar verdi.[59] 9 Temmuz 1997'de son üç yılın en düşük hisse senedi fiyatının görülmesi ve finansal kayıplar nedeniyle yönetim kurulu Gil Amelio'yu işten çıkardı. Jobs geçici olarak CEO oldu ve şirketin ürün grubunu yeniden oluşturmaya başladı.

1997 Macworld Expo'da Steve Jobs, Macintosh için Microsoft Office'in yeni versiyonlarını yayımlaması amacıyla Microsoft ile bir araya geleceğini duyurdu ve Microsoft, Apple'ın oy hakkı olmayan hisse senetlerine 150 milyon dolar yatırım yaptı.[60]

10 Kasım 1997'de Apple, sipariş üzerine üretim stratejisine bağlı olan Apple Online Store'u tanıttı.[61][62]

1998–2005: Verimliliğe geri dönüş
15 Ağustos 1998'de Apple, Macintosh 128K'i anımsatan yeni bilgisayarı iMac'i tanıttı. iMac tasarım ekibinin başında daha sonra iPod ve iPhone'u da tasarlayacak olan Jonathan Ive bulunuyordu.[63][64] iMac, modern teknolojisi ve kendine özgü tasarımıyla ilk beş ay içerisinde yaklaşık 800.000 adet satıldı.[65]

Bu dönemde Apple, profesyonel ve bireysel odaklı dijital prodüksiyon yazılımı portföyü oluşturmak amacıyla şirketler satın aldı. 1998 yılında Macromedia'nın Final Cut yazılımını satın alarak dijital video düzenleme pazarında genişleyeceğine dair sinyaller verdi.[66][67] Sonraki yıl hem bireylere hem de profesyonellere yönelik iMovie ile 2007 yılının başlarında 800.000 kayıtlı kullanıcıya ulaşarak önemli bir video düzenleme yazılımı haline gelecek olan Final Cut Pro'yu piyasaya sürdü.[68] 2002 yılında gelişmiş dijital kompozisyon uygulaması Shake için Nothing Real şirketi[69] ile birlikte daha sonra bireylere yönelik GarageBand uygulamasının gelişimini sağlayacak olan müzik prodüksiyon uygulaması Logic için Emagic şirketini satın aldı.[70][71] Aynı yıl iPhoto'nun yayımlanması ile birlikte iLife paketi tamamlanmış oldu.[72]


Apple perakende satış mağazaları potansiyel müşterilere ürünleri satın almadan kullanma imkânı vermektedir.
(2005 yılında Kuzey Michigan Caddesi, Chicago, Illinois’deki Apple Store’da)
24 Mart 2001'de OPENSTEP ve BSD Unix temelli Mac OS X, birkaç yıllık geliştirmenin ardından yayımlandı. Yeni işletim sistemi, Mac OS 9'dan geçenlere yardımcı olmak için Classic environment aracılığıyla OS 9 uygulamalarını destekliyordu.[73]

19 Mayıs 2001'de Apple ilk resmî perakende mağazasını Virginia ve California'da açtı.[74] 9 Temmuz'da DVD authoring şirketi Spruce Technologies'i satın aldı. 23 Ekim'de taşınabilir dijital müzik çalar iPod duyuruldu ve satışı 10 Ekim'de başladı. Çok başarılı olan ürün altı yılda 100 milyondan fazla sattı.[75][76] 2003 yılında iPod ile uyumlu ve $0.99'a müzik indirme imkânı veren çevrimiçi mağaza iTunes Store tanıtıldı. Bu servis hızla çevrimiçi müzik alanında pazar lideri haline geldi ve 19 Haziran 2008'de beş milyarıncı şarkı indirildi.[77]

2001 yılından itibaren Apple tasarım ekibi ilk kez iMac G3'te kullandıkları renkli yarı saydam plastiği gitgide terk etmeye başladı. Titanyum PowerBook ile başlayan süreç beyaz polikarbonat iBook ve iMac ile devam etti.[78][79]

2005–07: Intel'e geçiş
Ana madde: Apple'ın Intel işlemcilere geçişi

Apple'ın Ocak 2006'da duyurduğu Intel işlemcili ilk dizüstü bilgisayarı, MacBook Pro.

Apple Store (Zorlu Center, İstanbul)
6 Haziran 2005'te gerçekleştirilen Worldwide Developers Conference'da Steve Jobs, 2006 yılı itibarıyla Apple'ın Intel temelli Mac bilgisayar üreteceğini duyurdu.[80] 10 Ocak 2006'da yeni MacBook Pro ve iMac, Intel'in Core Duo işlemcisini kullanan ilk Apple bilgisayarı oldu. 7 Ağustos 2006'da Apple, tüm Mac ürünlerinde Intel'in yongalarını duyurulan tarihten bir yıl daha erken kullanmaya başladı.[80] Geçiş sürecinde Power Mac, iBook ve PowerBook serileri üretimden kalktı; Mac Pro, MacBook ve MacBook Pro bu serilerin yerini aldı.[81][82] 29 Nisan 2009'da The Wall Street Journal Apple'ın mikroçip tasarlamak için kendi mühendis ekibini kurduğunu duyurdu.[83]

Apple, kullanıcıların bilgisayarlarına Mac OS X yanında Windows XP ya da Windows Vista kurmalarına yardımcı olan Boot Camp yazılımını tanıttı.[84]

Apple'ın bu dönemdeki başarısı hisse senetlerine de yansıdı. 2003 yılının başı ile 2006 yılları arasında Apple'ın hisse seneti fiyatları 6 dolardan 80 doların üzerine çıkarak 10 kattan fazla artış gösterdi. Ocak 2006'da Apple'ın pazar payı Dell'i geçti.[85]

2007–11: Yaygın başarı
Apple, cep telefonu, taşınabilir müzik çalar ve kişisel bilgisayar alanında yenilik yapan iPhone, iPod Touch ve iPad ürünleriyle büyük başarı yakaladı. Buna ek olarak uygulama satın almak için kurduğu mağaza yeni bir iş modeli yarattı.

Steve Jobs, 9 Ocak 2007 Macworld Expo konuşmasında taşınabilir elektronik cihazlara önem verilmesi ve şirketin odak noktasının artık bilgisayar sektörü olmaması nedeniyle şirketin adının Apple Computer, Inc. yerine Apple, Inc. olarak değiştirildiğini duyurdu. Aynı etkinlikte iPhone ve Apple TV'nin de tanıtımı yapıldı.[86] İlerleyen günlerde Apple'ın hisse senedi fiyatları 97,80 dolara yükseldi ve mayıs ayında 100 dolar sınırını aştı.[87]

6 Ocak 2007'de Apple'ın internet sitesinde yayımlanan bir makalede Steve Jobs, müzik şirketleri kabul ederse Apple'ın iTunes Store'da DRM (Dijital Haklar Yönetimi) içermeyen müzik satmak istediğini açıkladı. (Böylece şarkılar üçüncü parti oynatıcılarda da dinlenebilecekti.)[88] 2 Nisan 2007'de Apple ve EMI birlikte açıklama yaparak mayıs ayından itibaren geçerli olmak üzere EMI kataloğunun iTunes Store'daki şarkılarından DRM teknolojisinin kaldırıldığını duyurdu.[89] Aynı yıl içerisinde diğer müzik şirketleri de buna katıldı.

Aynı yılın Temmuz ayında iPhone ve iPod Touch için üçüncü parti uygulama satmak amacıyla App Store yayımlandı.[90] Bir ay içerisinde 60 milyon uygulama satılması ve günlük ortalama 1 milyon dolar gelir getirmesi ile birlikte Jobs, Apple Store'un Apple için milyar dolarlık bir iş haline dönüşeceğini düşünmeye başladı.[91] Üç ay sonra iPhone'un popülerliği ile birlikte Apple, dünyanın en büyük üçüncü mobil cihaz üreticisi haline geldi.[92]

16 Aralık 2008'de Apple, 20 yıl boyunca katıldığı Macworld Expo'ya 2009 yılında son kez katılacağını açıkladı ve beklenenin aksine sunumu Steve Jobs yerine Phil Schiller gerçekleştirdi.[93] 1 ay sonra 14 Ocak 2009'da şirket içi bilgi notunda Jobs, sağlığına daha çok önem verebilmek ve basının sağlığı konusunda yaptığı spekülasyonlar olmadan şirketin ürünlerine daha iyi odaklanabilmesini sağlamak amacıyla 2009 yılının sonuna kadar 6 aylığına ücretli izin kullanacağını açıkladı.[94] Jobs'ın eksikliğine rağmen şirket 8.16 milyar dolarlık gelir ve 1.21 milyar dolarlık kar ile krizden bu yana geçirdiği en iyi çeyreği yaşadı.[95][96]

Yıllar süren tartışma ve dedikodulardan sonra 27 Ocak 2010'da Apple, geniş ekranlı tablet medya cihazı iPad'i tanıttı. iPhone ile aynı dokunmatik temelli işletim sistemini kullanan iPad, iPhone'un birçok uygulaması ile de uyumluydu. Bu özelliği iPad'e yayımlanmadan önce az bir geliştirme süresinin bulunmasına rağmen geniş bir uygulama kataloğuna sahip olmasını sağladı. 3 Nisan 2010'da iPad ABD'de satışa sunuldu ve aynı gün 300.000, aynı hafta ise 500.000 cihaz satıldı.[97] Aynı yılın Mayıs ayında Apple'ın pazar payı 1989'dan beri ilk kez rakibi Microsoft'u geçti.[98]

7 Haziran 2010'da Apple; görüntülü görüşme, çoklu görev ve anten görevi gören izole edilmemiş paslanmaz çelik tasarıma sahip olan dördüncü nesil iPhone'u tanıttı. Anten tasarımı nedeniyle bazı iPhone 4 kullanıcıları telefonu belirli bir şekilde tuttuklarında sinyal gücünün azaldığını rapor etti. Büyük medya kuruluşlarının bu konuyu çokça irdelemesi nedeniyle Apple basın toplantısı düzenleyerek sinyal sorununu çözmesi amacıyla kullanıcılara ücretsiz plastik kılıf önerdiğini açıkladı. Aynı yıl Apple iPod serisi mp3 oynatıcılarını yenileyerek çoklu dokunmatik özellikli iPod Nano'yu, Facetime özellikli iPod Touch'ı ve tuşlu iPod Shuffle'ı tanıttı.[99][100][101]

Kasım 2010'da Apple'ın hisse senetleri 300 dolar ile tüm zamanların en yüksek değerine ulaştı.[102] Buna ek olarak 20 Kasım'da Apple, MacBook Air dizüstü bilgisayarı ve iLife uygulamalarını güncelleyerek Mac OS X adını kullanan son versiyon olan Mac OS X Lion'ı tanıttı.[103] 6 Ocak 2011'de şirket iOS App Store benzeri dijital yazılım dağıtım platformu Mac App Store'u faaliyete geçirdi.[104] Apple, 2011 yılında gösterime giren Something Ventured belgeseline konu oldu.

2011–günümüz: Steve Jobs'ın ölümü ve sonrası
Steve Jobs 24 Ağustos 2011'de şirketin yönetim kurulu başkanlığından ayrıldığını açıkladı ve görevi Tim Cook'a bıraktı. Ancak 5 Ekim 2011 tarihinde ailesi tarafından yayınlanan bir bildiride "Steve Jobs aile üyeleri başucunda ve sükunet içinde öldü." açıklaması yapıldı. Tim Cook haberi büyük bir üzüntüyle öğrendiklerini söyledi. Cook, Apple, vizyon sahibi bir kişiyi ve bir yaratıcı dehayı; dünya inanılmaz bir insanı kaybetti Açıklamasının ardından kimi çevreler bu ölümün ardından şirketin kurucuları arasında yer alan Steve Wozniak'ın daha fazla sorumluluk alması gerektiğini savundu ancak bu olay Wozniak'ın çok net olumsuz yanıtı ile uygulamaya geçilmeden rafa kaldırılmış oldu. Şirket yeni bir yönetim kurulu oluşturarak Tim Cook'ın yönetiminde faaliyetlerine devam etmekte. Apple günümüzde 700 milyar dolar bütçesi ile dünyanın en zengin şirketi konumunda.[105]

Hukuki problemler
Apple, küresel çapta önemli vergi davalarıyla sık sık gündeme gelmiştir. En dikkat çekici dava, Avrupa Birliği'nin, Apple'ın İrlanda ile yaptığı anlaşma sonucunda 13 milyar Euro'luk vergi avantajı sağladığını iddia etmesiyle açılmıştır. AB Komisyonu, bu miktarın geri ödenmesini talep etmiş, ancak Apple ve İrlanda hükûmeti karara itiraz etmiş ve 2020'de Apple lehine sonuçlanmıştır. Ayrıca Apple, ABD dışında elde ettiği kârları offshore hesaplarda tutarak yüksek Amerikan vergilerinden kaçınmakla suçlanmış, fakat şirket bu uygulamanın yasal olduğunu savunmuştur.[106]

AB ülkelerinde Apple ve diğer teknoloji devlerine yönelik dijital hizmet vergisi tartışmaları da sürmektedir. Özellikle Fransa ve Almanya gibi ülkeler, bu şirketlerin sundukları dijital hizmetlerden daha fazla vergi ödemeleri gerektiğini savunmaktadır. Apple, bu tür vergilerin haksız olduğunu öne sürerek karşı çıkmaktadır. Şirketin vergi stratejileri, hem yasal hem de etik tartışmalara yol açmıştır.[107]

iPod
Ana madde: iPod

iPod ailesi, görüntüde sırasıyla iPod Shuffle, iPod Nano, iPod Classic ve iPod Touch
iPod, 23 Ekim 2001 tarihinde Apple tarafından tanıtılan müzik çalardır. Tanıtıldığı günden beri birçok güncelleme geçirmiştir, şu anda taşınabilir müzik çalar pazarının lideridir ve Eylül 2012 tarihine kadar 350 milyondan fazla satmıştır.[108]

Apple'ın şu an satışına devam ettiği iPod modelleri:

iPod Shuffle: Ultra taşınabilir müzik çalar. Sadece 2 GB kapasiteye sahip modeli bulunmaktadır. İlk modeli 2005 yılında tanıtılmıştır.
iPod Nano: Taşınabilir medya oynatıcısı, 16 GB'lık kapasiteye sahip modeli bulunmaktadır. İlk modeli 2005 yılında tanıtılmıştır.
iPod Touch: iOS işletim sistemiyle çalışan media oynatıcısı, 32 GB ve 64 GB kapasiteye sahip modelleri bulunmaktadır. İlk modeli 2007 yılında tanıtılmıştır. Apple A5 işlemcisine, Retina ekrana ve çift kameraya sahiptir. 1080p HD video kaydı yapabilmektedir.[109]
iPod Classic: Taşınabilir müzik oynatıcısı. 160 GB'lık kapasiteye sahip tek bir modeli vardır. İlk modeli 2001 yılında tanıtılmıştır.[110]
10 Mayıs 2022'de iPod Touch'un üretimi durdurulduğu için bu tarihten sonra iPod serisinin üretimi durdurulmuştur.[111]

iPad
Ana madde: iPad
Apple şirketi tarafından geliştirilen bir tablet bilgisayar ve iPod Touch'dan daha iyi özelliklere sahip olmasına ek olarak dört kat daha büyük retina ekran özelliği sunarak bu ekran sayesinde yazıcıdan çıktı alma, video, fotoğraflar ve medya dosyalarını multi-touch işlemler ile kullanmaya olanak sağlıyor. Wi-Fi kanalıyla internete bağlanabiliyor ve bazı modellerde 3G özelliğini sunuyor. Ayrıca iPad için iPhone OS'de kullanılan uygulamalara ek olarak özel tasarlanan bazı uygulamalar konmuş. Bu cihaz LED-backlit 9.7 inçlik (25 cm) renkli IPS LCD ekrana sahip ve metin girdileri için kullanılmak üzere sanal klavye de mevcut. iPad 27 Ocak 2010 yılında kamuoyuna duyuruldu ve FCC'nin onayının ardından Mart 2010'da (sadece Wi-Fi özelliğine sahip modeli) ve Nisan 2010'da (Wi-Fi+3G özellikli modeller) piyasaya sürüldü. Yaklaşık 9 ay sonra da 2 Mart 2011 tarihinde flansmani yapıldı ve 11 Mart 2011 tarihinde hem beyaz hem de siyah olmak üzere 2 farklı renkte (sadece Wi-Fi özelliğine sahip modeli) ve (Wi-Fi+3G özellikli modeller) piyasaya sunuldu. Son olarak da 7.9 inçlik ipad mini 2 ve ipad air piyasaya sürüldü renk seçenekleri space grey ve white'tır.

Apple 2021 yılından itibaren yani nesil Mac bilgisayarlarda kullandığı M serisi çiplerini de iPad modellerinde kullanmaya başlamıştır.

Şirketin telekomünikasyon sektörüne giriş sağladığı ürünüdür. Rakipleri Samsung, Sony, Nokia ve LG'nin bu sektördeki hegomonyasını kırmak amacı ile ilk model olan iPhone (Original) 2007 yılında şirketin yönetim kurulu başkanı Steve Jobs tarafından tanıtıldı. Yeni modelleri ile piyasaya sunulmaya devam etmektedir. Piyasaya sürülmüş son modeli İPhone 17, 17 air, 17 Pro, 17 Pro Max versiyonlarıdır. Ayrıca en güncel işletim sistemi iOS 26'dır.[112]

Apple Advanced Technology Group

Apple Advanced Technology Group (Cupertino, Kaliforniya)
1986-1997 yılları arasında hizmet vermiş bir araştırma-geliştirme laboratuvarıdır. Larry Tesler tarafından kurulmuş olan laboratuvar daha sonra David Nagel, Richard LeFaivre ve Donald Norman tarafından yönetilmiştir. Laboratuvar, Steve Jobs'un 1997'de Apple'a dönüşünün ardından kapanmıştır.

Logosunun anlamı

Apple'nin 1976'da Ronald Wayne tarafından tasarlanan ilk logosu
Steve Jobs'a göre; Apple ismi "fun, spirited and not intimidating" düşüncesi altında ortaya atılmıştır. Meyve diyetinde olan Steve Jobs çiftliğinden geri dönerken bu fikri benimsemiştir.

İlk logo Isaac Newton'un elma ağacının altında oturmasını imgeleyerek Ronald Wayne tarafından tasarlanmıştır. İlerleyen süreçte Rob Janoff tarafından düzenlenip yeni logo üzerinden bir parça alınmış ve gökkuşağı renkleriyle kaplanmış elma olarak sergilenmiştir. Rob Janoff hazırlamış olduğu logoyu tek renge kavuşturarak Jobs'a sundu. Logo kirazla karıştırılmaması için ısırık imgesi kullanılmaya devam edildi. Logo hâlen son haliyle kullanılmaktadır.

Logonun ortaya çıkışıyla alakalı toplum içinde yanlış anlaşılmalar 3 Ekim 2009 tarihinde Wayback Machine sitesinde arşivlendi. bulunmaktadır. Özellikle logonun çıkışı Alan Turing'in intihar biçimine dayatılmış, bunun üzerine çeşitli davalar gündeme gelmiştir.

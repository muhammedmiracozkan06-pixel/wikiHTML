    <p><em>Kategori: Kişiler</em></p>
    <p>Mevlana Celaleddin-i Rumi (1207-1273), Anadolu'da yaşamış mutasavvıf şair ve düşünürdür. Eserlerini Farsça yazmıştır.</p>

    <p>Mesnevi adlı eseri tasavvuf edebiyatının en önemli kaynaklarındandır. Konya'da yatmaktadır.</p>

    <h1>İkinci Dünya Savaşı</h1>
    <p><em>Kategori: Tarih</em></p>
    <p>İkinci Dünya Savaşı, 1939-1945 yılları arasında yaşanmış küresel bir savaştır. Müttefikler ile Mihver devletleri karşı karşıya gelmiştir.</p>

    <p>Savaş 1939'da Almanya'nın Polonya'yı işgaliyle başlamış, 1945'te sona ermiştir.</p>
